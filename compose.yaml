services:
  huddle:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      FANTASYPROS_API_KEY: ${FANTASYPROS_API_KEY:-}
      FANTASYPROS_DAILY_REQUEST_BUDGET: ${FANTASYPROS_DAILY_REQUEST_BUDGET:-24}
      TANK01_API_KEY: ${TANK01_API_KEY:-}
      TANK01_API_HOST: ${TANK01_API_HOST:-tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com}
      TANK01_MONTHLY_REQUEST_BUDGET: ${TANK01_MONTHLY_REQUEST_BUDGET:-40}
      HUDDLE_SLEEPER_TRENDS_ENABLED: ${HUDDLE_SLEEPER_TRENDS_ENABLED:-true}
      SLEEPER_TREND_LOOKBACK_HOURS: ${SLEEPER_TREND_LOOKBACK_HOURS:-24}
      SLEEPER_TREND_LIMIT: ${SLEEPER_TREND_LIMIT:-100}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-anthropic/claude-sonnet-4.6}
      YAHOO_CLIENT_ID: ${YAHOO_CLIENT_ID:-}
      YAHOO_CLIENT_SECRET: ${YAHOO_CLIENT_SECRET:-}
      YAHOO_REDIRECT_URI: ${YAHOO_REDIRECT_URI:-http://localhost:8787/auth/yahoo/callback}
      HUDDLE_YAHOO_OAUTH_ENABLED: ${HUDDLE_YAHOO_OAUTH_ENABLED:-false}
      HUDDLE_TOKEN_ENCRYPTION_KEY: ${HUDDLE_TOKEN_ENCRYPTION_KEY:-}
      HUDDLE_YAHOO_TOKEN_FILE: /app/data/secrets/yahoo-tokens.enc.json
      HUDDLE_YAHOO_DRAFT_AUTO_SYNC_ENABLED: ${HUDDLE_YAHOO_DRAFT_AUTO_SYNC_ENABLED:-true}
      HUDDLE_YAHOO_DRAFT_POLL_SECONDS: ${HUDDLE_YAHOO_DRAFT_POLL_SECONDS:-15}
      HUDDLE_YAHOO_DRAFT_MINIMUM_CROSSWALK_COVERAGE: ${HUDDLE_YAHOO_DRAFT_MINIMUM_CROSSWALK_COVERAGE:-0.80}
      HUDDLE_YAHOO_WEEKLY_AUTO_REFRESH_ENABLED: ${HUDDLE_YAHOO_WEEKLY_AUTO_REFRESH_ENABLED:-true}
      HUDDLE_YAHOO_WEEKLY_REFRESH_HOURS: ${HUDDLE_YAHOO_WEEKLY_REFRESH_HOURS:-24}
      HUDDLE_YAHOO_WEEKLY_PREVIEW_TTL_MINUTES: ${HUDDLE_YAHOO_WEEKLY_PREVIEW_TTL_MINUTES:-60}
      HUDDLE_WEEK_OVERRIDE: ${HUDDLE_WEEK_OVERRIDE:-}
      HUDDLE_OPERATIONS_MAXIMUM_EVIDENCE_AGE_HOURS: ${HUDDLE_OPERATIONS_MAXIMUM_EVIDENCE_AGE_HOURS:-36}
      HUDDLE_YAHOO_EVIDENCE_RETENTION_DAYS: ${HUDDLE_YAHOO_EVIDENCE_RETENTION_DAYS:-30}
      HUDDLE_COMPLIANCE_MAINTENANCE_ENABLED: ${HUDDLE_COMPLIANCE_MAINTENANCE_ENABLED:-false}
      HUDDLE_LEAGUE_ONBOARDING_ENABLED: ${HUDDLE_LEAGUE_ONBOARDING_ENABLED:-false}
      HUDDLE_LEAGUE_ONBOARDING_DIR: /app/data/leagues
      HUDDLE_MANAGED_LEAGUE_REGISTRY: /app/data/leagues/registry.managed.json
      HUDDLE_SEASON: ${HUDDLE_SEASON:-2026}
      HUDDLE_PLAYER_SNAPSHOT_FILE: /app/data/player-pool.json
      HUDDLE_FANTASYPROS_AUTO_REFRESH_ENABLED: ${HUDDLE_FANTASYPROS_AUTO_REFRESH_ENABLED:-true}
      HUDDLE_FANTASYPROS_REFRESH_INTERVAL_HOURS: ${HUDDLE_FANTASYPROS_REFRESH_INTERVAL_HOURS:-24}
    volumes:
      - huddle-state:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  huddle-state:
