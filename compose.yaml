services:
  huddle:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      FANTASYPROS_API_KEY: ${FANTASYPROS_API_KEY:-}
      FANTASYPROS_DAILY_REQUEST_BUDGET: ${FANTASYPROS_DAILY_REQUEST_BUDGET:-24}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-anthropic/claude-sonnet-4.6}
      YAHOO_CLIENT_ID: ${YAHOO_CLIENT_ID:-}
      YAHOO_CLIENT_SECRET: ${YAHOO_CLIENT_SECRET:-}
      HUDDLE_SEASON: ${HUDDLE_SEASON:-2026}
      HUDDLE_FANTASYPROS_AUTO_REFRESH_ENABLED: ${HUDDLE_FANTASYPROS_AUTO_REFRESH_ENABLED:-true}
      HUDDLE_FANTASYPROS_REFRESH_INTERVAL_HOURS: ${HUDDLE_FANTASYPROS_REFRESH_INTERVAL_HOURS:-24}
    volumes:
      - huddle-state:/app/data
    restart: unless-stopped

volumes:
  huddle-state:
