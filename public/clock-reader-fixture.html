<!doctype html><html lang="en"><meta charset="utf-8"><title>Huddle clock test source · simulated</title><style>body{margin:0;background:#171a23;color:#f3f5fa;font:18px Arial}.header{height:100px;display:flex;align-items:center;justify-content:space-around}.clock{text-align:center;font-size:26px;font-weight:bold}.turn{font-size:18px}aside{margin:60px;color:#e4d784}button{font:inherit;padding:12px;margin:10px}</style>
<div class="header"><div>YAHOO FANTASY FOOTBALL DRAFT<br><small>Clock reader validation - H2H</small></div><div class="clock"><div id="clock"></div><div id="turn" class="turn"></div></div></div>
<aside><h1>Simulated clock — validation only</h1><p>This tests capture and recognition. It is not a Yahoo mock or live clock evidence.</p><button id="thirty">Use short timer</button><button id="seventy">Use longer timer</button><button id="pause">Pause / resume frames</button></aside>
<script>let duration=30,deadline=performance.now()+duration*1000,pick=2,paused=false;function show(){if(paused)return;let left=Math.ceil((deadline-performance.now())/1000);if(left<=0){pick++;duration=duration===30?70:30;deadline=performance.now()+duration*1000;left=duration;}document.querySelector('#clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');document.querySelector('#turn').textContent='YOUR TURN • ROUND '+Math.ceil(pick/2)+', PICK '+pick;}document.querySelector('#thirty').onclick=()=>{duration=30;deadline=performance.now()+30000;pick++;show();};document.querySelector('#seventy').onclick=()=>{duration=70;deadline=performance.now()+70000;pick++;show();};document.querySelector('#pause').onclick=()=>paused=!paused;setInterval(show,100);show();</script></html>
