<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DR browser rehearsal · no Yahoo connection</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#eee;color:#14203b}main{display:grid;grid-template-columns:1fr 1fr;height:100vh}.room{overflow:auto;padding:12px}header{position:sticky;top:0;z-index:3;background:#fff;padding:12px;border-bottom:3px solid #6047d9}h1{font-size:18px;margin:0}#turn{font-weight:700}#clock{font-size:24px}button,input,select{font:inherit;padding:6px;margin:3px}button{cursor:pointer}table{border-collapse:collapse;width:100%;background:white}th,td{border-bottom:1px solid #ddd;text-align:left;padding:6px}td .ys-player span{display:block}.ys-player span:nth-child(n+2){font-size:12px}.notice{font-size:12px;background:#fff0bd;padding:6px}.controls{display:flex;flex-wrap:wrap;align-items:center}.search-wrap{display:flex;align-items:center}.search-wrap input{width:185px;min-width:0}.search-wrap.has-search input{width:0;padding:0;border:0;margin:0}#queue{font-size:12px;background:#e7e0ff;padding:8px}iframe{width:100%;height:100%;border:0}#error{color:#ad1010}.counts{font-size:12px}@media(max-width:1100px){main{display:block}.recording{display:none}}
</style>
<main><section class="room"><header><h1>LOCAL DR REHEARSAL</h1><p class="notice">Simulated Yahoo controls · synthetic projections · six teams · seat 1 · twenty rounds · 75 seconds. No real Yahoo connection or draft submissions.</p><div id="clock">Waiting</div><div id="turn">Draft Starting Soon</div><div class="counts" id="counts">0 completed picks</div></header>
<div><button id="start">Start rehearsal</button><button title="Autodraft" id="auto">Autodraft</button><button id="queue-fault">Test wrong queue result</button><span id="error" role="status"></span></div>
<div role="tablist"><button id="players-tab" aria-selected="true">Players</button><button id="results-tab" aria-selected="false">Results</button></div>
<section id="players"><div class="controls"><div class="search-wrap"><input placeholder="Search for a player"><button type="reset" aria-label="Clear search" hidden>Clear search</button></div><select id="position"><option>All Positions</option><option>Quarterbacks</option><option>Running Backs</option><option>Wide Receivers</option><option>Tight Ends</option><option>Kickers</option><option>Team Defenses</option></select></div><table><thead><tr><th>Draft</th><th>Player</th><th>XRank</th><th>ADP</th><th>Bye</th><th>Proj Pts</th></tr></thead><tbody id="available"></tbody></table></section>
<section id="results" hidden><button aria-selected="true">Round by Round</button><table><thead><tr><th>Pick</th><th>Player</th><th>Team</th></tr></thead><tbody id="log"></tbody></table></section>
<section id="queue" aria-label="Queued players"><strong>Queue</strong><ul></ul></section></section>
<iframe class="recording" title="Huddle draft view" src="/* HUDDLE_VIEW */"></iframe></main>
<script>
let state=null,tab='Players',queue=[],busy=false,lastRows='',wrongQueue=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,body){const response=await fetch('/rehearsal/'+path,{method:body?'POST':'GET',headers:{'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(data.message);return data;}
function identity(p){return `<div class="ys-player" data-id="${esc(p.yahooPlayerId)}"><span title="${esc(p.name)}">${esc(p.name)}</span><span>${p.position}</span><span>${esc(p.team)}</span></div>`;}
function render(){if(!state)return;const n=state.picks.length+1,done=state.phase==='completed';$('#turn').textContent=state.phase==='waiting'?'Draft Starting Soon':done?'Draft Complete':`Your Turn • Round ${Math.ceil(n/6)}, Pick ${n}`;$('#clock').textContent=state.phase==='waiting'?'Waiting':done?'Finished':`${Math.floor(state.secondsLeft/60).toString().padStart(2,'0')}:${(state.secondsLeft%60).toString().padStart(2,'0')}`;$('#counts').textContent=`${state.picks.length} completed picks · ${state.manualCount} acknowledged manual inputs · ${state.autoCount} autopicks`;
$('#start').disabled=state.phase!=='waiting';$('#queue-fault').disabled=state.phase!=='waiting';$('#auto').innerHTML=state.autodraft?'<svg data-icon="checkmark-default"></svg>Autodraft':'Autodraft';$('#players').hidden=tab!=='Players';$('#results').hidden=tab!=='Results';$('#players-tab').setAttribute('aria-selected',String(tab==='Players'));$('#results-tab').setAttribute('aria-selected',String(tab==='Results'));
const search=$('input').value.toLowerCase().trim(),position={Quarterbacks:'QB','Running Backs':'RB','Wide Receivers':'WR','Tight Ends':'TE',Kickers:'K','Team Defenses':'DEF'}[$('#position').value];$('.search-wrap').classList.toggle('has-search',Boolean(search));$('[type=reset]').hidden=!search;
let available=state.available.filter(p=>(!search||p.name.toLowerCase().includes(search))&&(!position||p.position===position)).slice(0,18);if(state.reverseRows)available.reverse();
const html=available.map(p=>`<tr><td>${!done?`<button data-draft="${p.yahooPlayerId}" ${state.phase==='waiting'?'disabled':''}>Draft</button><button data-queue="${p.yahooPlayerId}">Queue</button>`:''}</td><td>${identity(p)}</td><td>${p.expertRank}</td><td>${p.adp}</td><td>${p.byeWeek}</td><td>${p.projectedPoints}</td></tr>`).join('');
if(html!==lastRows){$('#available').innerHTML=html;lastRows=html;}
$('#log').innerHTML=[...state.picks].reverse().map(p=>`<tr><td>${p.overallPick}</td><td>${identity(p)}</td><td>${p.isMine?'Your Team':'Other Team'}</td></tr>`).join('');
queue=queue.filter(id=>state.available.some(p=>p.yahooPlayerId===id));$('#queue ul').innerHTML=queue.map(id=>{const p=state.available.find(p=>p.yahooPlayerId===id);return `<li>${identity(p)}<button data-draft="${id}">Draft</button><button data-remove="${id}">Remove</button></li>`;}).join('');
}
async function update(){if(busy)return;busy=true;try{state=await request('state');render();}catch(e){$('#error').textContent=e.message;}finally{busy=false;}}
async function action(path,body){try{state=await request(path,body);$('#error').textContent='';render();}catch(e){$('#error').textContent=e.message;}}
$('#start').onclick=()=>action('start',{});$('#auto').onclick=()=>action('autodraft',{enabled:!state.autodraft});$('#players-tab').onclick=()=>{tab='Players';render();};$('#results-tab').onclick=()=>{tab='Results';render();};$('input').oninput=render;$('[type=reset]').onclick=()=>{$('input').value='';render();};$('#position').onchange=render;
$('#queue-fault').onclick=()=>{wrongQueue=true;$('#error').textContent='The next queue input will deliberately add a different player.';};
document.addEventListener('click',event=>{const button=event.target.closest('button');if(button?.dataset.draft)action('select',{yahooPlayerId:button.dataset.draft});if(button?.dataset.queue){const id=wrongQueue?state.available.find(p=>p.yahooPlayerId!==button.dataset.queue&&!queue.includes(p.yahooPlayerId)).yahooPlayerId:button.dataset.queue;wrongQueue=false;if(!queue.includes(id))queue.push(id);render();}if(button?.dataset.remove){queue=queue.filter(id=>id!==button.dataset.remove);render();}});
setInterval(update,250);update();
</script></html>
