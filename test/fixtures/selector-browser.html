<!doctype html><meta charset="utf-8"><title>Controlled Yahoo controls · simulated</title>
<style>body{font:16px system-ui;margin:20px}header{position:sticky;top:0;background:white;padding:10px}button{padding:8px}td{padding:5px 14px}input{width:180px}.collapsed input{width:0;padding:0;border:0}#notice{background:#ffe8bb}table{border-collapse:collapse}tr{border-bottom:1px solid #ddd}.ys-player span{display:block}</style>
<header><b>CONTROLLED BROWSER VALIDATION — SYNTHETIC FEED</b><div id="clock">00:30</div><div id="turn">Draft Starting Soon</div><button id="start">Start controlled draft</button><button title="Autodraft"><svg data-icon="refresh"></svg></button><button id="auto">Autodraft</button><div id="notice" hidden><div><button><svg data-icon="close-default"></svg></button></div>You have been put into autopick mode due to inactivity. You can turn off autopick mode to resume live drafting.</div></header>
<div role="tablist"><button id="players" aria-selected="true">Players</button></div>
<div class="collapsed" id="search-wrap"><input placeholder="Search for a player" value="stale search"><button id="clear"><svg data-icon="close-circle-filled"></svg></button></div>
<select><option>All Positions</option><option>Quarterbacks</option><option>Running Backs</option></select>
<table><thead><tr><th>Queue</th><th>Player</th><th>XRank</th><th>ADP</th><th>Bye</th><th>Proj Pts</th></tr></thead><tbody></tbody></table>
<script>
let state=null,busy=false,last='',dismissed=false;const $=s=>document.querySelector(s);
async function action(b){const r=await fetch('/validation/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error('Action rejected');await update();}
function render(){if(!state)return;$('#clock').textContent=String(Math.floor(state.seconds/60)).padStart(2,'0')+':'+String(state.seconds%60).padStart(2,'0');$('#turn').textContent=state.phase==='waiting'?'Draft Starting Soon':state.phase==='completed'?'Draft Complete':(state.mine?'YOUR TURN':'Opponent’s Pick')+' • ROUND '+Math.ceil(state.pick/8)+', PICK '+state.pick;
 $('#start').disabled=state.phase!=='waiting';$('#auto').innerHTML=(state.autodraft?'<svg data-icon="checkmark-default"></svg>':'')+'Autodraft';$('#notice').hidden=!state.autodraft||dismissed;$('th').textContent=state.mine?'Draft':'Queue';
 const shown=$('input').value?[]:state.available;const html=shown.map(p=>'<tr><td>'+(state.mine&&state.phase==='drafting'?'<button data-id="'+p.yahooPlayerKey.split('.p.')[1]+'">Draft</button>':'')+'</td><td><div class="ys-player" data-id="'+p.yahooPlayerKey.split('.p.')[1]+'"><span title="'+p.name+'">'+p.name+'</span><span>'+p.position+'</span><span>'+p.team+'</span></div></td><td>'+p.expertRank+'</td><td>'+p.adp+'</td><td>6</td><td>'+p.projectedPoints+'</td></tr>').join('');if(html!==last){$('tbody').innerHTML=html;last=html;}}
 async function update(){if(busy)return;busy=true;try{state=await(await fetch('/validation/state')).json();render();}finally{busy=false;}}
 $('#start').onclick=()=>action({action:'start'});$('#auto').onclick=()=>action({action:'auto'});$('#clear').onclick=()=>{$('input').value='';render();};$('#notice button').onclick=()=>{dismissed=true;render();};$('tbody').onclick=e=>{const b=e.target.closest('button');if(b)action({action:'draft',id:b.dataset.id});};update();setInterval(update,200);
</script>
