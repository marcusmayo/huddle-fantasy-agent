name: Readiness development review
on:
  push:
    branches: [feat/in-app-draft-readiness]
    paths: [.github/workflows/readiness-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: zip -qr readiness-dependencies.zip node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: readiness-dependencies
          path: readiness-dependencies.zip
          retention-days: 1
