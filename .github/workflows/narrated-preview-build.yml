name: Render narrated Huddle previews
on:
  push:
    branches: [docs/narrated-previews-20260906]
    paths:
      - scripts/media/render_audio.py
      - .github/workflows/narrated-preview-build.yml
permissions:
  contents: read
concurrency:
  group: narrated-huddle-previews
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'marcusmayo/huddle-fantasy-agent' && github.ref == 'refs/heads/docs/narrated-previews-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng fluidsynth
          python -m pip install --quiet torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet kokoro==0.9.4 transformers==4.51.3 numpy==1.26.4 scipy==1.14.1 soundfile==0.13.1 mido==1.3.3 faster-whisper==1.2.1
      - name: Synthesize narration, compose original music, mix and validate
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
        run: python scripts/media/render_audio.py
      - name: Check speech intelligibility against the approved script
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '2'
        shell: python
        run: |
          import difflib, json, re
          from pathlib import Path
          from faster_whisper import WhisperModel
          model = WhisperModel('base.en', device='cpu', compute_type='int8', cpu_threads=2)
          segments, info = model.transcribe('.media-build/narration.wav', beam_size=5, vad_filter=False)
          decoded = [{'start': s.start, 'end': s.end, 'text': s.text} for s in segments]
          actual = ' '.join(s['text'] for s in decoded)
          expected = Path('docs/assets/huddle-narration.txt').read_text()
          norm = lambda s: re.findall(r'[a-z]+', s.lower().replace('hudl', 'huddle'))
          similarity = difflib.SequenceMatcher(None, norm(expected), norm(actual)).ratio()
          result = {'method': 'Independent base.en ASR of narration stem', 'expected': expected, 'transcribed': actual, 'token_similarity': similarity, 'segments': decoded, 'note': 'Automated intelligibility check, not subjective human listening approval.'}
          Path('.media-build/speech-check.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          assert similarity >= 0.85, 'Speech transcription differs materially from the script; review before publication.'
      - name: Prepare concise README links and media notes
        shell: python
        run: |
          from pathlib import Path
          p=Path('README.md'); text=p.read_text()
          a='<!-- HUDDLE-LINKEDIN-VIDEOS:START -->';b='<!-- HUDDLE-LINKEDIN-VIDEOS:END -->'
          assert text.count(a)==text.count(b)==1
          section='''<!-- HUDDLE-LINKEDIN-VIDEOS:START -->
          ## Huddle in 60 seconds

          [![Watch Huddle with narration and original orchestral music](docs/assets/huddle-linkedin-overview-preview.gif)](https://raw.githubusercontent.com/marcusmayo/huddle-fantasy-agent/main/docs/assets/huddle-narrated-landscape-1920x1080.mp4)

          **[Watch with sound — 1920 × 1080](https://raw.githubusercontent.com/marcusmayo/huddle-fantasy-agent/main/docs/assets/huddle-narrated-landscape-1920x1080.mp4)** · **[LinkedIn feed — 1080 × 1350](https://raw.githubusercontent.com/marcusmayo/huddle-fantasy-agent/main/docs/assets/huddle-narrated-feed-1080x1350.mp4)** · **[X thread — 1280 × 720](https://raw.githubusercontent.com/marcusmayo/huddle-fantasy-agent/main/docs/assets/huddle-narrated-x-1280x720.mp4)**

          September 2026 · AI-generated narration and an original orchestral score. The animated GIF is silent; click it for the video with sound. Feature overview, not live-account footage.

          [Captions](docs/assets/huddle-narration-en.srt) · [Media notes and silent originals](docs/media/narrated-previews.md) · [Earlier walkthrough — August 9](docs/assets/huddle-product-demo.mp4) · [Thumbnail](docs/assets/huddle-linkedin-overview-thumbnail.jpg)
          <!-- HUDDLE-LINKEDIN-VIDEOS:END -->'''
          section='\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())
          p.write_text(text[:text.index(a)]+section+text[text.index(b)+len(b):])
          folder=Path('docs/media'); folder.mkdir(exist_ok=True)
          (folder/'narrated-previews.md').write_text('''# Narrated Huddle previews

          Three 60-second MP4 exports retain the existing feature-overview visuals. The landscape and LinkedIn feed video streams are copied without re-encoding. The X export scales the landscape picture to 1280 × 720. Each includes stereo AAC-LC audio at 48 kHz.

          ## Sound

          An original script, a stock synthetic American male voice blend, and an original 24-bar orchestral arrangement aim for a classic football-documentary mood. No NFL theme, film score, broadcaster recording, or custom announcer voice clone is used. The music uses French horns, low brass, strings, contrabass, timpani, trumpet accents and field percussion. Music ducks beneath dialogue. The master targets -16 LUFS and -1.5 dBTP.

          Voice generation: [Kokoro-82M](https://huggingface.co/hexgrad/Kokoro-82M), Apache-2.0 weights, am_michael/am_onyx stock voice blend. Music was newly composed for this Huddle edit and rendered with [GeneralUser GS](https://github.com/mrbumpy409/GeneralUser-GS). Its [author license](https://github.com/mrbumpy409/GeneralUser-GS/blob/main/documentation/LICENSE.txt) allows private and commercial music creation; it also explains the author's limitations on historical sample provenance. No sample library or model weights are redistributed here.

          [Narration text](../assets/huddle-narration.txt) · [English SRT](../assets/huddle-narration-en.srt) · [English WebVTT](../assets/huddle-narration-en.vtt) · [Original score MIDI](../assets/huddle-original-orchestral-cue.mid) · [Export validation](../assets/huddle-narrated-validation.json)

          The captions reproduce the narration, with sentence timing estimated inside the fitted scene windows. These are not word-level forced-alignment captions. Existing on-screen feature text is unchanged. Narration explicitly places the readiness check inside the app. No real league data is added. The media build uses no paid generation API or Runway credits.

          ## Where to use each file

          - LinkedIn article, website or GitHub: narrated landscape, 1920 × 1080.
          - LinkedIn feed: narrated portrait, 1080 × 1350.
          - X thread: narrated landscape, 1280 × 720, 60 seconds, below 512 MB. This follows the conservative non-Premium upload profile.

          [LinkedIn specifications](https://www.linkedin.com/help/linkedin/answer/a548372) · [X upload limits](https://help.x.com/en/using-x/x-videos) · [X encoding recommendations](https://docs.x.com/x-api/media/quickstart/best-practices)

          The README GIF cannot carry sound; clicking it opens the narrated MP4. Playback may start muted depending on the browser. No LinkedIn or X post was published or live-platform upload tested by this build.

          ## Silent originals and earlier verification

          [Landscape](../assets/huddle-linkedin-article-1920x1080.mp4) · [Feed](../assets/huddle-linkedin-feed-1080x1350.mp4) · [Original export report](../assets/huddle-linkedin-video-validation.json)

          ## Rebuild

          `scripts/media/render_audio.py` is an optional media-production utility, not a Huddle runtime dependency. It requires Python 3.11, CPU PyTorch 2.6.0, Kokoro 0.9.4, Transformers 4.51.3, NumPy 1.26.4, SciPy 1.14.1, SoundFile 0.13.1, Mido 1.3.3, espeak-ng, FFmpeg with rubberband, FluidSynth, and network access to download the public voice model and instrument bank. It never reads Huddle credentials or contacts Yahoo.
          '''.replace('\n          ','\n'))
      - name: Save exports and review audio as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: huddle-narrated-previews
          retention-days: 3
          include-hidden-files: true
          path: |
            docs/assets/huddle-narrated-*.mp4
            docs/assets/huddle-narrated-validation.json
            docs/assets/huddle-narration*
            docs/assets/huddle-original-orchestral-cue.mid
            docs/media/narrated-previews.md
            .media-build/narration.wav
            .media-build/orchestra.wav
            .media-build/huddle-voiceover-mix.wav
            .media-build/speech-check.json
      - name: Commit media only to the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/assets/huddle-narrated-*.mp4 docs/assets/huddle-narrated-validation.json docs/assets/huddle-narration* docs/assets/huddle-original-orchestral-cue.mid docs/media/narrated-previews.md
          git rm .github/workflows/narrated-preview-build.yml
          git diff --cached --check
          git commit -m 'media: add football-style narration and original orchestral previews'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:docs/narrated-previews-20260906
